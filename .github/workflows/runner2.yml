name: Persistent Runner2
on:
  schedule:
    # Alle 5 Stunden (sicherer als 6, damit Lücken minimal bleiben)
    - cron: '0 */5 * * *'
  workflow_dispatch:   # Manuell starten möglich

concurrency:
  group: persistent-runner
  cancel-in-progress: false   # Alten Job nicht abbrechen, wenn neuer startet

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # knapp unter dem 6-Stunden-Limit

    steps:
      - name: Suppress all logging if disabled
        id: logs
        run: |
          ENABLE_LOGS="${{ secrets.ENABLE_LOGS }}"
          if [ -z "$ENABLE_LOGS" ] || [ "$ENABLE_LOGS" != "true" ]; then
            echo "LOGGING_DISABLED=true" >> $GITHUB_ENV
            exec > /dev/null 2>&1
          else
            echo "LOGGING_DISABLED=false" >> $GITHUB_ENV
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android || true
          docker system prune -af --volumes || true
          df -h

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Start Cloudflare Tunnel (background)
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          sleep 5
          if [ "$LOGGING_DISABLED" != "true" ]; then
            ps aux | grep cloudflared || true
          fi

      - name: Clone repository & Branch bestimmen
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          BRANCH_SECRET: ${{ secrets.BRANCH }}
        run: |
          git clone --no-single-branch --depth 1 https://${GH_USERNAME}:${GH_PAT}@github.com/${PRIVATE_REPO}.git app
          cd app

          if [ -n "$BRANCH_SECRET" ]; then
            # Weg 1: Fester Branch aus dem Secret "BRANCH"
            BRANCH="$BRANCH_SECRET"
            MODE="Fest über Secret BRANCH gesetzt"
          else
            # Weg 2: Automatisch den Branch mit der letzten Aktivität (Commit/Merge/Push) wählen
            BRANCH=$(git for-each-ref --sort=-committerdate refs/remotes/origin/ --format='%(refname:short)' \
                      | grep -v 'origin/HEAD' | head -n1 | sed 's#^origin/##')
            MODE="Automatisch erkannt (aktivster Branch)"
          fi

          echo "=========================================="
          echo "🔀 Branch: $BRANCH"
          echo "   Modus:  $MODE"
          echo "=========================================="

          git checkout -B "$BRANCH" "origin/$BRANCH"
          echo "ACTIVE_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Diagnose vor dem Build
        working-directory: app
        run: |
          echo "== Branch: $ACTIVE_BRANCH =="
          echo "== Speicherplatz =="
          df -h
          echo "== RAM =="
          free -h
          echo "== Docker Images/Cache =="
          docker system df

      - name: Execute custom command
        working-directory: app
        env:
          RUN_COMMAND: ${{ secrets.RUN_COMMAND }}
        run: |
          eval "$RUN_COMMAND"

      - name: Diagnose nach Fehler
        if: failure()
        run: |
          echo "== Branch beim Fehler: $ACTIVE_BRANCH =="
          echo "== Speicherplatz nach Fehler =="
          df -h
          echo "== Kernel-Log (OOM-Check) =="
          dmesg | tail -100 || true
          echo "== Docker Events =="
          docker events --since 10m --until now || true

      - name: Keep job alive (almost 6 hours)
        run: |
          while true; do
            sleep 3600
          done

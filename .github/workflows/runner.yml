name: Persistent Runner
on:
   schedule:
    # Alle 5 Stunden (sicherer als 6, damit Lücken minimal bleiben) # ONLY Comment
     - cron: '0 */5 * * *'
   workflow_dispatch:   # Manuell starten möglich

concurrency:
  group: persistent-runner
  cancel-in-progress: false   # Alten Job nicht abbrechen, wenn neuer startet

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # knapp unter dem 6-Stunden-Limit

    steps:
      - name: Suppress all logging if disabled
        id: logs
        run: |
          ENABLE_LOGS="${{ secrets.ENABLE_LOGS }}"
          if [ -z "$ENABLE_LOGS" ] || [ "$ENABLE_LOGS" != "true" ]; then
            echo "LOGGING_DISABLED=true" >> $GITHUB_ENV
            # Alle weiteren Ausgaben unterdrücken
            exec > /dev/null 2>&1
          else
            echo "LOGGING_DISABLED=false" >> $GITHUB_ENV
          fi

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Start Cloudflare Tunnel (background)
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          # Läuft im Hintergrund, solange der Job lebt
          nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          sleep 5
          # Optional: prüfen ob Tunnel hoch ist (nur wenn Logging an)
          if [ "$LOGGING_DISABLED" != "true" ]; then
            ps aux | grep cloudflared || true
          fi

      - name: Clone private repository
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          git clone --depth 1 https://${GH_USERNAME}:${GH_PAT}@github.com/${PRIVATE_REPO}.git app
          cd app

      - name: Execute custom command
        working-directory: app
        env:
          RUN_COMMAND: ${{ secrets.RUN_COMMAND }}
        run: |
          # Der Befehl aus dem Secret
          eval "$RUN_COMMAND"

      - name: Keep job alive (almost 6 hours)
        run: |
          # Einfach warten, bis timeout greift oder manuell abgebrochen wird
          # Der Tunnel und der Command laufen parallel weiter
          while true; do
            sleep 3600
            # Optional: hier Health-Check einbauen
          done
